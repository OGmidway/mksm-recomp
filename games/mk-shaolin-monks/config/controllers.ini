# Imported standard PCSX2 gamepad bindings. Device numbers are connected-controller order.
[Pad1]
Device = 0
Select = Back
L3 = LeftStick
R3 = RightStick
Start = Start
Up = DPadUp
Right = DPadRight
Down = DPadDown
Left = DPadLeft
L2 = +LeftTrigger
R2 = +RightTrigger
L1 = LeftShoulder
R1 = RightShoulder
Triangle = North
Circle = East
Cross = South
Square = West
LLeft = -LeftX
LRight = +LeftX
LUp = -LeftY
LDown = +LeftY
RLeft = -RightX
RRight = +RightX
RUp = -RightY
RDown = +RightY
Deadzone = 0.0
AxisScale = 1.33
TriggerThreshold = 0.0

